<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Unidades — AD Pirapora</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="./src/style.css">
  <style>
    .units-hero {
      padding: 12rem 2rem 8rem;
      background: radial-gradient(circle at 70% 30%, rgba(255, 107, 0, 0.1), transparent 40%),
                  linear-gradient(rgba(5, 15, 43, 0.95), rgba(5, 15, 43, 0.95)),
                  url('https://www.transparenttextures.com/patterns/cubes.png'),
                  var(--primary);
      color: white;
      text-align: center;
      position: relative;
    }
    .breadcrumb {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
      opacity: 0.6;
    }
    .breadcrumb a { color: white; text-decoration: none; transition: color 0.3s; }
    .breadcrumb a:hover { color: var(--accent); }
    
    .units-stats-bar {
      display: inline-flex;
      gap: 3rem;
      margin-top: 3rem;
      padding: 1.5rem 4rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      backdrop-filter: blur(10px);
    }
    .u-stat { display: flex; flex-direction: column; align-items: center; }
    .u-stat strong { font-size: 1.5rem; color: var(--accent); font-weight: 900; }
    .u-stat span { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6; }

    .search-section {
      padding: 3rem 2rem;
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      position: sticky;
      top: var(--header-h);
      z-index: 900;
    }
    .search-wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }
    .search-wrap i {
      position: absolute;
      left: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 20px;
    }
    .search-wrap input {
      width: 100%;
      padding: 1.2rem 1.5rem 1.2rem 3.5rem;
      border-radius: 50px;
      border: 1.5px solid var(--gray-200);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--gray-50);
    }
    .search-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--white);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .units-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* Dois a Dois Lado a Lado */
      gap: 3rem;
      padding: 6rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (max-width: 1024px) { .units-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) {
      .units-hero { padding: 9rem 1.5rem 5rem; }
      .units-hero h1 { font-size: 2.5rem !important; }
      .units-stats-bar { 
        flex-direction: row; 
        gap: 1rem; 
        padding: 1rem; 
        width: 100%; 
        border-radius: 16px; 
      }
      .u-stat strong { font-size: 1.1rem; }
      .u-stat span { font-size: 0.55rem; }
      .units-grid { padding: 3rem 1.5rem; gap: 1.5rem; grid-template-columns: 1fr; }
      
      .btn-back span { display: none; } /* Deixa apenas a seta no mobile para economizar espaço */
      .btn-back { padding: 0.6rem; }
    }
  </style>
</head>
<body>

  <header id="header">
    <nav>
      <a href="index.html" class="logo-wrap">
        <img src="/logo-full.png" alt="Logo AD Pirapora" class="logo-img">
      </a>
      <a href="index.html" class="btn-back">
        <i data-lucide="arrow-left"></i>
        <span>Voltar ao Início</span>
      </a>
    </nav>
  </header>

  <section class="units-hero">
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">Início</a>
        <span>/</span>
        <span style="color: var(--accent);">Nossas Unidades</span>
      </div>
      
      <h1 style="font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 1.5rem;">Todas as Nossas<br>Unidades</h1>
      <p style="font-size: 1.1rem; opacity: 0.7; max-width: 600px; margin: 0 auto; line-height: 1.6;">O Ministério de Pirapora está presente em cada bairro, levando a palavra de Deus e servindo à comunidade com amor e dedicação.</p>
      
      <div class="units-stats-bar">
        <div class="u-stat">
          <strong>30+</strong>
          <span>Congregações</span>
        </div>
        <div class="u-stat" style="width: 1px; height: 30px; background: rgba(255,255,255,0.1); align-self: center;"></div>
        <div class="u-stat">
          <strong>100%</strong>
          <span>Cobertura Regional</span>
        </div>
      </div>
    </div>
  </section>

  <section class="search-section">
    <div class="container">
      <div class="search-wrap">
        <i data-lucide="search"></i>
        <input type="text" id="unitSearch" placeholder="Pesquisar por bairro ou nome do pastor...">
      </div>
    </div>
  </section>

  <section class="bg-light">
    <div class="units-grid" id="allUnitsGrid">
      <!-- Renderizado via JS -->
    </div>
  </section>

  <footer style="padding: 4rem 2rem; background: var(--primary); color: white; text-align: center;">
    <img src="/logo-white.png" alt="Logo" style="height: 40px; margin-bottom: 1.5rem;">
    <p style="opacity: 0.6; font-size: 0.8rem;">© 2026 Assembleia de Deus — Ministério de Pirapora.</p>
  </footer>

  <!-- Importar dados do main.js (Garante que as congregações sejam as mesmas) -->
  <script src="./src/main.js"></script>
  <script>
    // Função específica para renderizar na página de unidades
    function renderAllUnits(filter = '') {
      const grid = document.getElementById('allUnitsGrid');
      if (!grid) return;

      const filtered = congregacoes.filter(c => 
        c.nome.toLowerCase().includes(filter.toLowerCase()) || 
        c.bairro.toLowerCase().includes(filter.toLowerCase()) ||
        c.pastor.toLowerCase().includes(filter.toLowerCase())
      );

      grid.innerHTML = filtered.map(c => `
        <div class="cong-card reveal visible">
          <img src="${c.foto}" alt="${c.pastor}" class="pastor-photo">
          <span class="pastor-name">${c.pastor}</span>
          <h3>${c.nome}</h3>
          <p>${c.endereco} — ${c.bairro}</p>
          <div class="cong-hours">${c.cultos}</div>
        </div>
      `).join('');
      
      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 4rem; opacity: 0.5;">Nenhuma unidade encontrada com esse termo.</p>`;
      }
    }

    // Listener para o campo de busca
    document.getElementById('unitSearch').addEventListener('input', (e) => {
      renderAllUnits(e.target.value);
    });

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      renderAllUnits();
      lucide.createIcons();
    });
  </script>
</body>
</html>
